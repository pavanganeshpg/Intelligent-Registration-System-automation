<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration System</title>
    <style>
        :root {
            --color-primary: #33808d;
            --color-primary-hover: #1d7480;
            --color-success: #21808d;
            --color-error: #c0152f;
            --color-warning: #a84b2f;
            --color-bg: #fcfcf9;
            --color-surface: #fffffe;
            --color-text: #133452;
            --color-text-secondary: #626c71;
            --color-border: rgba(94, 82, 64, 0.2);
            --color-error-bg: rgba(192, 21, 47, 0.1);
            --color-success-bg: rgba(33, 128, 141, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: var(--color-surface);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--color-text);
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: var(--color-text-secondary);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .alert {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .alert-success {
            background: var(--color-success-bg);
            color: var(--color-success);
            border: 1px solid var(--color-success);
        }

        .alert-error {
            background: var(--color-error-bg);
            color: var(--color-error);
            border: 1px solid var(--color-error);
        }

        .alert strong {
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--color-text);
            font-weight: 500;
            font-size: 14px;
        }

        .required {
            color: var(--color-error);
            margin-left: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--color-border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            background: var(--color-surface);
            color: var(--color-text);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(51, 128, 141, 0.1);
        }

        input.error, select.error {
            border-color: var(--color-error);
            background-color: var(--color-error-bg);
        }

        .error-message {
            color: var(--color-error);
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 400;
        }

        input[type="checkbox"], input[type="radio"] {
            width: auto;
            cursor: pointer;
        }

        .password-strength {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .password-strength-bar.weak {
            width: 33%;
            background: var(--color-error);
        }

        .password-strength-bar.medium {
            width: 66%;
            background: var(--color-warning);
        }

        .password-strength-bar.strong {
            width: 100%;
            background: var(--color-success);
        }

        .password-strength-text {
            font-size: 12px;
            margin-top: 4px;
            color: var(--color-text-secondary);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--color-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(51, 128, 141, 0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 20px;
            }
        }

        .success-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>User Registration</h1>
        <p class="subtitle">Please fill in all required fields to create your account</p>

        <div id="alertBox" class="alert"></div>

        <form id="registrationForm" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name <span class="required">*</span></label>
                    <input type="text" id="firstName" name="firstName" required>
                    <div class="error-message" id="firstNameError"></div>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name <span class="required">*</span></label>
                    <input type="text" id="lastName" name="lastName" required>
                    <div class="error-message" id="lastNameError"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" required>
                    <div class="error-message" id="emailError"></div>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" required>
                    <div class="error-message" id="phoneError"></div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120">
                    <div class="error-message" id="ageError"></div>
                </div>

                <div class="form-group">
                    <label>Gender <span class="required">*</span></label>
                    <div class="gender-group">
                        <label class="checkbox-label">
                            <input type="radio" name="gender" value="male" required>
                            Male
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="gender" value="female">
                            Female
                        </label>
                        <label class="checkbox-label">
                            <input type="radio" name="gender" value="other">
                            Other
                        </label>
                    </div>
                    <div class="error-message" id="genderError"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3"></textarea>
                <div class="error-message" id="addressError"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="country">Country <span class="required">*</span></label>
                    <select id="country" name="country" required>
                        <option value="">Select Country</option>
                    </select>
                    <div class="error-message" id="countryError"></div>
                </div>

                <div class="form-group">
                    <label for="state">State <span class="required">*</span></label>
                    <select id="state" name="state" required disabled>
                        <option value="">Select State</option>
                    </select>
                    <div class="error-message" id="stateError"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="city">City <span class="required">*</span></label>
                <select id="city" name="city" required disabled>
                    <option value="">Select City</option>
                </select>
                <div class="error-message" id="cityError"></div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <div class="password-strength-text" id="passwordStrengthText"></div>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="terms" name="terms" required>
                    I agree to the Terms &amp; Conditions <span class="required">*</span>
                </label>
                <div class="error-message" id="termsError"></div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" disabled>Register</button>
        </form>
    </div>

    <script>
        // Disposable email domains (sample list)
        const disposableDomains = [
            'tempmail.com', 'guerrillamail.com', 'mailinator.com', '10minutemail.com',
            'throwaway.email', 'maildrop.cc', 'yopmail.com', 'temp-mail.org',
            'getnada.com', 'mohmal.com', 'trashmail.com', 'fakeinbox.com'
        ];

        // Country phone codes
        const phoneCountryCodes = {
            'US': ['+1'],
            'IN': ['+91'],
            'GB': ['+44'],
            'CA': ['+1'],
            'AU': ['+61'],
            'DE': ['+49'],
            'FR': ['+33'],
            'JP': ['+81'],
            'CN': ['+86'],
            'BR': ['+55']
        };

        // Location data
        const locationData = {
            'US': {
                name: 'United States',
                states: {
                    'CA': { name: 'California', cities: ['Los Angeles', 'San Francisco', 'San Diego', 'Sacramento'] },
                    'NY': { name: 'New York', cities: ['New York City', 'Buffalo', 'Rochester', 'Albany'] },
                    'TX': { name: 'Texas', cities: ['Houston', 'Dallas', 'Austin', 'San Antonio'] },
                    'FL': { name: 'Florida', cities: ['Miami', 'Orlando', 'Tampa', 'Jacksonville'] }
                }
            },
            'IN': {
                name: 'India',
                states: {
                    'MH': { name: 'Maharashtra', cities: ['Mumbai', 'Pune', 'Nagpur', 'Nashik'] },
                    'DL': { name: 'Delhi', cities: ['New Delhi', 'Central Delhi', 'North Delhi', 'South Delhi'] },
                    'KA': { name: 'Karnataka', cities: ['Bangalore', 'Mysore', 'Hubli', 'Mangalore'] },
                    'TN': { name: 'Tamil Nadu', cities: ['Chennai', 'Coimbatore', 'Madurai', 'Tiruchirappalli'] }
                }
            },
            'GB': {
                name: 'United Kingdom',
                states: {
                    'ENG': { name: 'England', cities: ['London', 'Manchester', 'Birmingham', 'Liverpool'] },
                    'SCT': { name: 'Scotland', cities: ['Edinburgh', 'Glasgow', 'Aberdeen', 'Dundee'] },
                    'WLS': { name: 'Wales', cities: ['Cardiff', 'Swansea', 'Newport', 'Wrexham'] },
                    'NIR': { name: 'Northern Ireland', cities: ['Belfast', 'Derry', 'Lisburn', 'Newry'] }
                }
            },
            'CA': {
                name: 'Canada',
                states: {
                    'ON': { name: 'Ontario', cities: ['Toronto', 'Ottawa', 'Mississauga', 'Hamilton'] },
                    'QC': { name: 'Quebec', cities: ['Montreal', 'Quebec City', 'Laval', 'Gatineau'] },
                    'BC': { name: 'British Columbia', cities: ['Vancouver', 'Victoria', 'Surrey', 'Burnaby'] },
                    'AB': { name: 'Alberta', cities: ['Calgary', 'Edmonton', 'Red Deer', 'Lethbridge'] }
                }
            },
            'AU': {
                name: 'Australia',
                states: {
                    'NSW': { name: 'New South Wales', cities: ['Sydney', 'Newcastle', 'Wollongong', 'Central Coast'] },
                    'VIC': { name: 'Victoria', cities: ['Melbourne', 'Geelong', 'Ballarat', 'Bendigo'] },
                    'QLD': { name: 'Queensland', cities: ['Brisbane', 'Gold Coast', 'Cairns', 'Townsville'] },
                    'WA': { name: 'Western Australia', cities: ['Perth', 'Fremantle', 'Mandurah', 'Bunbury'] }
                }
            }
        };

        // Form elements
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');

        // Populate countries
        const countrySelect = document.getElementById('country');
        Object.keys(locationData).forEach(code => {
            const option = document.createElement('option');
            option.value = code;
            option.textContent = locationData[code].name;
            countrySelect.appendChild(option);
        });

        // Country change handler
        countrySelect.addEventListener('change', function() {
            const stateSelect = document.getElementById('state');
            const citySelect = document.getElementById('city');
            
            stateSelect.innerHTML = '<option value="">Select State</option>';
            citySelect.innerHTML = '<option value="">Select City</option>';
            citySelect.disabled = true;
            
            if (this.value) {
                stateSelect.disabled = false;
                const states = locationData[this.value].states;
                Object.keys(states).forEach(code => {
                    const option = document.createElement('option');
                    option.value = code;
                    option.textContent = states[code].name;
                    stateSelect.appendChild(option);
                });
            } else {
                stateSelect.disabled = true;
            }
            
            validateField(this);
        });

        // State change handler
        document.getElementById('state').addEventListener('change', function() {
            const citySelect = document.getElementById('city');
            const countryCode = countrySelect.value;
            
            citySelect.innerHTML = '<option value="">Select City</option>';
            
            if (this.value && countryCode) {
                citySelect.disabled = false;
                const cities = locationData[countryCode].states[this.value].cities;
                cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            } else {
                citySelect.disabled = true;
            }
            
            validateField(this);
        });

        // City change handler
        document.getElementById('city').addEventListener('change', function() {
            validateField(this);
        });

        // Validation functions
        function showError(fieldId, message) {
            const field = document.getElementById(fieldId);
            const errorElement = document.getElementById(fieldId + 'Error');
            field.classList.add('error');
            errorElement.textContent = message;
            errorElement.classList.add('show');
        }

        function clearError(fieldId) {
            const field = document.getElementById(fieldId);
            const errorElement = document.getElementById(fieldId + 'Error');
            field.classList.remove('error');
            errorElement.classList.remove('show');
        }

        function validateField(field) {
            const fieldId = field.id;
            const value = field.value.trim();

            clearError(fieldId);

            // Required field validation
            if (field.hasAttribute('required') && !value) {
                if (field.type === 'radio') {
                    const checked = document.querySelector('input[name="' + field.name + '"]:checked');
                    if (!checked) {
                        showError('gender', 'Please select your gender');
                        return false;
                    }
                } else if (field.type === 'checkbox') {
                    if (!field.checked) {
                        showError(fieldId, 'This field is required');
                        return false;
                    }
                } else {
                    showError(fieldId, 'This field is required');
                    return false;
                }
            }

            // Specific validations
            if (fieldId === 'email' && value) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(value)) {
                    showError(fieldId, 'Please enter a valid email address');
                    return false;
                }

                const domain = value.split('@')[1];
                if (disposableDomains.includes(domain)) {
                    showError(fieldId, 'Disposable email addresses are not allowed');
                    return false;
                }
            }

            if (fieldId === 'phone' && value) {
                const selectedCountry = countrySelect.value;
                if (selectedCountry && phoneCountryCodes[selectedCountry]) {
                    const validCodes = phoneCountryCodes[selectedCountry];
                    const hasValidCode = validCodes.some(code => value.startsWith(code));
                    if (!hasValidCode) {
                        showError(fieldId, `Phone must start with ${validCodes.join(' or ')} for ${locationData[selectedCountry].name}`);
                        return false;
                    }
                }

                const phoneRegex = /^\+?[1-9]\d{7,14}$/;
                if (!phoneRegex.test(value.replace(/[\s-]/g, ''))) {
                    showError(fieldId, 'Please enter a valid phone number');
                    return false;
                }
            }

            if (fieldId === 'confirmPassword' && value) {
                const password = document.getElementById('password').value;
                if (value !== password) {
                    showError(fieldId, 'Passwords do not match');
                    return false;
                }
            }

            return true;
        }

        // Password strength checker
        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            const strengthText = document.getElementById('passwordStrengthText');

            if (!password) {
                strengthBar.className = 'password-strength-bar';
                strengthText.textContent = '';
                return;
            }

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            strengthBar.className = 'password-strength-bar';
            if (strength <= 2) {
                strengthBar.classList.add('weak');
                strengthText.textContent = 'Weak';
                strengthText.style.color = '#c0152f';
            } else if (strength <= 4) {
                strengthBar.classList.add('medium');
                strengthText.textContent = 'Medium';
                strengthText.style.color = '#a84b2f';
            } else {
                strengthBar.classList.add('strong');
                strengthText.textContent = 'Strong';
                strengthText.style.color = '#21808d';
            }

            validateField(this);
        });

        // Real-time validation
        const inputs = form.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('blur', function() {
                validateField(this);
                checkFormValidity();
            });
            input.addEventListener('input', function() {
                if (this.classList.contains('error')) {
                    validateField(this);
                }
                checkFormValidity();
            });
        });

        // Gender radio buttons
        const genderRadios = document.querySelectorAll('input[name="gender"]');
        genderRadios.forEach(radio => {
            radio.addEventListener('change', function() {
                clearError('gender');
                checkFormValidity();
            });
        });

        // Terms checkbox
        document.getElementById('terms').addEventListener('change', function() {
            validateField(this);
            checkFormValidity();
        });

        // Check overall form validity
        function checkFormValidity() {
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const gender = document.querySelector('input[name="gender"]:checked');
            const country = document.getElementById('country').value;
            const state = document.getElementById('state').value;
            const city = document.getElementById('city').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;

            const hasErrors = document.querySelectorAll('.error').length > 0;

            const isValid = firstName && lastName && email && phone && gender && 
                          country && state && city && password && confirmPassword && 
                          terms && !hasErrors;

            submitBtn.disabled = !isValid;
        }

        // Show alert
        function showAlert(type, title, message) {
            alertBox.className = 'alert alert-' + type;
            alertBox.innerHTML = '<strong>' + title + '</strong>' + message;
            alertBox.style.display = 'block';
            alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // Validate all fields
            let isValid = true;
            const requiredFields = form.querySelectorAll('[required]');
            
            requiredFields.forEach(field => {
                if (!validateField(field)) {
                    isValid = false;
                }
            });

            // Check gender
            const genderChecked = document.querySelector('input[name="gender"]:checked');
            if (!genderChecked) {
                showError('gender', 'Please select your gender');
                isValid = false;
            }

            if (!isValid) {
                showAlert('error', '❌ Error', 'Please fix all errors before submitting');
                return;
            }

            // Success
            showAlert('success', '✅ Registration Successful!', 'Your profile has been submitted successfully.');
            
            // Reset form after 2 seconds
            setTimeout(() => {
                form.reset();
                submitBtn.disabled = true;
                document.getElementById('state').disabled = true;
                document.getElementById('city').disabled = true;
                document.getElementById('passwordStrengthBar').className = 'password-strength-bar';
                document.getElementById('passwordStrengthText').textContent = '';
                
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 3000);
            }, 2000);
        });

        // Initialize
        checkFormValidity();
    </script>
</body>
</html>
